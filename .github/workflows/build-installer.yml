name: Build Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the installer to a GitHub Release on tags

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          $node = Select-Xml -Path HandMirror.csproj -XPath '//Version' | Select-Object -First 1
          $v = if ($node) { $node.Node.InnerText.Trim() } else { '1.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: |
          dotnet publish HandMirror.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o bin/Release/net10.0-windows10.0.19041.0/win-x64/publish-selfcontained
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\HandMirror.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandMirrorSetup-${{ steps.ver.outputs.version }}
          path: installer/HandMirrorSetup.exe
          if-no-files-found: error

      - name: Attach installer to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/HandMirrorSetup.exe
