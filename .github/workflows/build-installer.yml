name: Build Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release and attach the installer

env:
  # Run the JS-based actions (checkout, setup-dotnet, upload-artifact,
  # action-gh-release) on Node 24 instead of the deprecated Node 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          # Monotonic, always-increasing version so the in-app updater can compare.
          $v = "1.1.${{ github.run_number }}"
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: |
          dotnet publish HandMirror.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o bin/Release/net10.0-windows10.0.19041.0/win-x64/publish-selfcontained
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\HandMirror.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandMirrorSetup-${{ steps.ver.outputs.version }}
          path: installer/HandMirrorSetup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Hand Mirror ${{ steps.ver.outputs.version }}
          files: installer/HandMirrorSetup.exe
          make_latest: true
